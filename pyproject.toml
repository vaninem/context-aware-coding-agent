[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-engineering-lab"
version = "0.1.0"
description = "A chapter-9 context-engineering scaffold with student TODOs"
requires-python = ">=3.10"
dependencies = ["langgraph>=1.2.21,<2", "langgraph-checkpoint-sqlite>=3.1.3,<4"]

[project.optional-dependencies]
embedding = ["httpx[socks]>=0.27,<1", "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1"]
benchmark = ["numpy>=1.26,<3", "tiktoken>=0.7,<1"]

[project.scripts]
context-lab = "context_lab.cli:main"

[tool.setuptools.packages.find]
include = ["context_lab*"]
